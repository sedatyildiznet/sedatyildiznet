<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Sedat Yıldız — Senior Software &amp; Systems Architect</title>
  <desc id="desc">Animated professional profile introduction for Sedat Yıldız.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1627"/>
      <stop offset="1" stop-color="#07101b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="10%" r="75%">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".16"/>
      <stop offset=".6" stop-color="#0ea5e9" stop-opacity=".03"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="998" height="298" rx="18"/>
    </clipPath>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .name { font: 700 43px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -.8px; }
    .role { font: 500 21px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .2px; }
    .label { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.25px; }
    .mono { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .fade-1 { animation: rise .75s ease-out both; }
    .fade-2 { animation: rise .75s .16s ease-out both; }
    .fade-3 { animation: rise .75s .32s ease-out both; }
    .line { stroke-dasharray: 380; stroke-dashoffset: 380; animation: draw 1.1s .45s cubic-bezier(.22,.75,.28,1) forwards; }
    .pulse { transform-origin: 786px 42px; animation: pulse 2.2s ease-in-out infinite; }
    .scan { animation: scan 7s linear infinite; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse {
      0%, 100% { opacity: .5; transform: scale(.82); }
      50% { opacity: 1; transform: scale(1.18); }
    }
    @keyframes scan {
      from { transform: translateX(-1040px); }
      to { transform: translateX(1040px); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .line { stroke-dashoffset: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#glow)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect class="scan" x="-90" y="-40" width="80" height="390" fill="#38bdf8" opacity=".025" transform="rotate(12)"/>

    <g class="fade-1">
      <circle cx="39" cy="42" r="4" fill="#38bdf8"/>
      <text x="53" y="47" class="mono" fill="#94a3b8">sedatyildiz.net</text>
    </g>

    <g class="fade-1">
      <circle class="pulse" cx="786" cy="42" r="5" fill="#2dd4bf" filter="url(#softGlow)"/>
      <text x="800" y="47" class="mono" fill="#94a3b8">systems online</text>
    </g>

    <g class="fade-2">
      <text x="39" y="126" class="name" fill="#f8fafc">Sedat Yıldız</text>
      <text x="39" y="163" class="role" fill="#cbd5e1">Senior Software &amp; Systems Architect</text>
      <path class="line" d="M39 181 H419" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g class="fade-3">
      <text x="39" y="226" class="label" fill="#7dd3fc">SYSTEMS ARCHITECTURE</text>
      <text x="233" y="226" class="label" fill="#94a3b8">LINUX / DEVOPS</text>
      <text x="381" y="226" class="label" fill="#5eead4">HOSTING AUTOMATION</text>
      <text x="584" y="226" class="label" fill="#94a3b8">AI INTEGRATION</text>
      <text x="739" y="226" class="label" fill="#7dd3fc">SECURITY</text>
    </g>

    <g class="fade-3">
      <text x="39" y="267" class="mono" fill="#64748b">PHP · Python · JavaScript · Linux · Docker · Nginx · MySQL · Cloudflare</text>
      <text x="936" y="267" class="mono" fill="#2dd4bf">&gt;_</text>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="298" rx="18" fill="none" stroke="#334155" stroke-opacity=".72"/>
</svg>