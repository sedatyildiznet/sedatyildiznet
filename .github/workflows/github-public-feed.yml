name: GitHub Public Feed to Telegram

on:
  schedule:
    # Stagger away from :00/:05/... to reduce GitHub Actions scheduler congestion.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/github-public-feed.yml"
      - "tools/github_public_feed.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: github-public-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore feed state
        uses: actions/cache/restore@v4
        with:
          path: .github-public-feed-state.json
          key: github-public-feed-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            github-public-feed-

      - name: Publish new public GitHub events
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_FEED_USERNAME: sedatyildiznet
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/github_public_feed.py

      - name: Send Telegram test on manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ GitHub Public Feed aktif. Public GitHub aktiviteleri bu kanala otomatik olarak gönderilecek."

      - name: Save feed state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .github-public-feed-state.json
          key: github-public-feed-${{ github.run_id }}-${{ github.run_attempt }}
