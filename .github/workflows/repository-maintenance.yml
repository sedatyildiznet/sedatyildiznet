name: Repository Maintenance

on:
  push:
    paths:
      - ".github/workflows/repository-maintenance.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove obsolete Actions runs and caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "repository-maintenance",
          }

          def request(path, method="GET"):
              req = urllib.request.Request(api + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      return json.loads(raw.decode()) if raw else None
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  raise RuntimeError(f"{method} {path}: {e.code} {body}") from e

          deleted_runs = 0
          page = 1
          while True:
              data = request(f"/repos/{repo}/actions/runs?per_page=100&page={page}")
              runs = data.get("workflow_runs", [])
              if not runs:
                  break
              for run in runs:
                  if (
                      run.get("name") == "GitHub Public Feed to Telegram"
                      or run.get("path") == ".github/workflows/github-public-feed.yml"
                  ):
                      request(f"/repos/{repo}/actions/runs/{run['id']}", "DELETE")
                      deleted_runs += 1
                      print(f"Deleted run {run['id']}")
              if len(runs) < 100:
                  break
              page += 1

          deleted_caches = 0
          page = 1
          while True:
              data = request(f"/repos/{repo}/actions/caches?per_page=100&page={page}")
              caches = data.get("actions_caches", [])
              if not caches:
                  break
              matched = [c for c in caches if str(c.get("key", "")).startswith("github-public-feed-")]
              for cache in matched:
                  request(f"/repos/{repo}/actions/caches/{cache['id']}", "DELETE")
                  deleted_caches += 1
                  print(f"Deleted cache {cache['id']} {cache.get('key')}")
              if len(caches) < 100:
                  break
              page += 1

          print(f"Deleted {deleted_runs} obsolete workflow run(s)")
          print(f"Deleted {deleted_caches} obsolete cache(s)")
          PY
